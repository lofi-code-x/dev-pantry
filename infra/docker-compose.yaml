services:
  postgres:
    image: postgres:16
    container_name: questlab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: questlab
      POSTGRES_USER: questlab
      POSTGRES_PASSWORD: <PASSWORD>
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U questlab -d questlab" ]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata_local: